services:
  unitcare-web:
    build:
      context: ./unitcare
      dockerfile: Dockerfile
    container_name: unitcare-web
    ports:
      - "8080:80"
    volumes:
      - ./unitcare:/var/www/html
    networks:
      - mrs-network

  unitcare-vite:
    image: node:22-alpine
    container_name: unitcare-vite
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./unitcare:/app
    networks:
      - mrs-network

  unitcare-api-web:
    build:
      context: ./unitcare-api
      dockerfile: Dockerfile
    container_name: unitcare-api-web
    ports:
      - "8081:80"
    volumes:
      - ./unitcare-api:/var/www/html
    networks:
      - mrs-network

  unitcare-api-vite:
    image: node:22-alpine
    container_name: unitcare-api-vite
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5174:5174"
    volumes:
      - ./unitcare-api:/app
    networks:
      - mrs-network

networks:
  mrs-network:
    driver: bridge