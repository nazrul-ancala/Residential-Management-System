services:
  - type: web
    name: unitcare-api
    runtime: docker
    dockerfilePath: ./unitcare-api/Dockerfile.fly
    dockerContext: ./unitcare-api
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://unitcare-api.onrender.com
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: TOKEN_PASS1
        sync: false
      - key: TOKEN_PASS2
        sync: false
      - key: FRONTEND_URL
        value: https://unitcare-app.onrender.com
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

  - type: web
    name: unitcare-app
    runtime: docker
    dockerfilePath: ./unitcare/Dockerfile.fly
    dockerContext: ./unitcare
    plan: free
    buildArgs:
      - name: VITE_API_URL
        value: https://unitcare-api.onrender.com
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://unitcare-app.onrender.com
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
