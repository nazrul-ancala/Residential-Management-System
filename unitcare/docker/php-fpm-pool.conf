[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Both apps share Clever Cloud's 5-connection limit.
; 2 workers each = 4 connections max = safe under the limit of 5.
pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
